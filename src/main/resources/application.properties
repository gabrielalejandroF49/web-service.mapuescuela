# ---------- Datasource para producción (SQL Server) ----------
spring.datasource.url=jdbc:sqlserver://DB_HOST:1433;databaseName=DB_NAME
spring.datasource.username=DB_USER
spring.datasource.password=DB_PASS
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------- Flowable ----------
flowable.database-schema-update=true
flowable.check-process-definitions=true

# ---------- JPA / Hibernate (si en el futuro usas JPA) ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ---------- Fallback H2 (opcional) ----------
# Para usar H2 temporalmente, comenta las propiedades SQL Server y descomenta las siguientes:
# spring.datasource.url=jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
