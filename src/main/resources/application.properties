# ---------- Datasource para producción (SQL Server) ----------
spring.datasource.url=jdbc:sqlserver://mapuescueladmin.database.windows.net:1433;databaseName=MapuEscuela
spring.datasource.username=mapuescueladmin
spring.datasource.password=Mapu1234!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
flowable.database-schema=dbo


# ---------- Flowable ----------
flowable.database-schema-update=true
flowable.check-process-definitions=true
flowable.rest.app.security.enabled=false
flowable.idm.app.security.enabled=false
flowable.modeler.app.security.enabled=false
flowable.admin.app.security.enabled=false
flowable.process-definition-location-prefix=classpath:/processes/
flowable.process-definition-location-suffixes=.bpmn20.xml





# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ---------- Fallback H2 (opcional) ----------
# Para usar H2 temporalmente, comenta las propiedades de SQL Server y descomenta las siguientes:
# spring.datasource.url=jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver

# ---------- Debug de auto-configuración ----------
logging.level.org.flowable.engine.impl.bpmn.deployer=DEBUG
logging.level.org.flowable.engine.impl.persistence.deploy=DEBUG

server.port=8081

